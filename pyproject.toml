[tool.poetry]
name = "hospital-appointment-api"
version = "0.1.0"
description = "Hospital Appointment Management API built with FastAPI, SQLAlchemy and Alembic"
authors = ["Student <student@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.95.0"
pydantic = "^1.10.13"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
SQLAlchemy = "^1.4.0"
alembic = "^1.11.0"
python-dotenv = "^1.0.0"
email-validator = "^2.3.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
httpx = "^0.27.0"
ruff = "^0.15.0"
bandit = "^1.7.5"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
